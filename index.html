<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sukuna ⛩️ — King of Curses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #f4f0e6;
    --paper-dark: #e8e2d2;
    --accent: #b3202c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    background: var(--paper);
    color: var(--ink);
    height: 100dvh;
    display: flex;
    overflow: hidden;
    background-image:
      radial-gradient(circle, rgba(26,26,26,0.10) 1px, transparent 1.4px),
      radial-gradient(circle, rgba(26,26,26,0.06) 1px, transparent 1.4px);
    background-size: 14px 14px, 22px 22px;
    background-position: 0 0, 7px 11px;
  }

  /* ===== Sidebar: chat history panel ===== */
  #sidebar {
    width: 265px;
    flex: 0 0 265px;
    background: var(--paper);
    border-right: 3px solid var(--ink);
    box-shadow: 4px 0 0 rgba(26,26,26,0.12);
    display: flex;
    flex-direction: column;
    z-index: 30;
  }
  #sidebar .sb-head {
    padding: 12px 14px;
    border-bottom: 3px solid var(--ink);
    font-family: 'Bangers', cursive;
    font-size: 1.25rem;
    letter-spacing: 2px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #newChat {
    margin: 12px 12px 6px;
    font-family: 'Bangers', cursive;
    letter-spacing: 1px;
    font-size: 1.05rem;
    padding: 8px 12px;
    background: var(--ink);
    color: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 15px 255px 15px 225px / 225px 15px 255px 15px;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(179,32,44,0.9);
  }
  #newChat:active { transform: translate(2px,2px); box-shadow: 0 0 0; }
  #convoList {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .convo {
    position: relative;
    padding: 8px 30px 8px 12px;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 4px 16px 14px 18px / 14px 5px 16px 6px;
    box-shadow: 2px 2px 0 rgba(26,26,26,0.7);
    cursor: pointer;
    transition: transform 0.05s;
  }
  .convo:hover { background: var(--paper-dark); }
  .convo.active { background: var(--ink); color: #fff; }
  .convo .c-title {
    font-size: 1rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .convo .c-date { font-size: 0.72rem; opacity: 0.55; }
  .convo .c-del {
    position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    opacity: 0.5;
    cursor: pointer;
    padding: 4px;
  }
  .convo .c-del:hover { opacity: 1; color: var(--accent); }
  .convo.active .c-del:hover { color: #ff8a94; }
  #sidebar .sb-foot { padding: 10px 12px; border-top: 2px dashed var(--ink); }
  #resetBtn {
    width: 100%;
    font-family: 'Patrick Hand', cursive;
    font-size: 0.95rem;
    padding: 6px;
    background: var(--paper);
    color: var(--accent);
    border: 2.5px solid var(--accent);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 2px 2px 0 var(--accent);
    cursor: pointer;
  }
  #resetBtn:active { transform: translate(2px,2px); box-shadow: 0 0 0; }

  #backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(26,26,26,0.45);
    z-index: 25;
  }

  /* ===== Main column ===== */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--paper);
    border-bottom: 3px solid var(--ink);
    box-shadow: 0 4px 0 rgba(26,26,26,0.15);
    z-index: 5;
  }
  header .title {
    font-family: 'Bangers', cursive;
    font-size: 1.7rem;
    letter-spacing: 2px;
    transform: rotate(-1.2deg);
    white-space: nowrap;
  }
  header .title .red { color: var(--accent); }
  header .sub { font-size: 0.85rem; opacity: 0.65; transform: rotate(0.6deg); }
  header .spacer { flex: 1; }
  .ink-btn {
    font-family: 'Patrick Hand', cursive;
    font-size: 1rem;
    background: var(--paper);
    color: var(--ink);
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    padding: 4px 12px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .ink-btn:hover { background: var(--paper-dark); }
  .ink-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  #menuBtn { display: none; }

  /* ===== Chat area ===== */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .row { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 42px; height: 42px;
    flex: 0 0 42px;
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bangers', cursive;
    font-size: 1.15rem;
    box-shadow: 2px 2px 0 rgba(26,26,26,0.8);
    user-select: none;
  }
  .row.sukuna .avatar { background: var(--ink); color: #fff; transform: rotate(-2deg); }
  .row.user .avatar { transform: rotate(2deg); }
  .bubble {
    position: relative;
    padding: 10px 16px;
    font-size: 1.08rem;
    line-height: 1.45;
    background: #fff;
    border: 2.5px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(26,26,26,0.85);
    white-space: pre-wrap;
    word-wrap: break-word;
    max-width: 100%;
  }
  .row.sukuna .bubble { border-radius: 4px 20px 18px 22px / 18px 6px 20px 8px; transform: rotate(-0.35deg); }
  .row.user .bubble { background: var(--paper-dark); border-radius: 20px 6px 22px 16px / 8px 20px 6px 18px; transform: rotate(0.35deg); }
  .bubble::before {
    content: "";
    position: absolute;
    top: 14px;
    width: 14px; height: 14px;
    background: inherit;
    border: 2.5px solid var(--ink);
  }
  .row.sukuna .bubble::before { left: -9px; border-right: none; border-top: none; transform: rotate(45deg) skew(-8deg, -8deg); }
  .row.user .bubble::before { right: -9px; border-left: none; border-bottom: none; transform: rotate(45deg) skew(-8deg, -8deg); }
  .bubble img.sent-img {
    display: block;
    max-width: min(260px, 100%);
    border: 2.5px solid var(--ink);
    border-radius: 8px 14px 10px 16px / 12px 8px 14px 6px;
    margin-bottom: 6px;
    box-shadow: 2px 2px 0 rgba(26,26,26,0.6);
  }
  .who {
    font-family: 'Bangers', cursive;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .row.sukuna .who { color: var(--accent); opacity: 0.9; }
  .thinking span { display: inline-block; animation: bob 1s infinite; font-weight: bold; }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .bubble em { color: var(--accent); font-style: normal; font-family: 'Bangers', cursive; letter-spacing: 1px; }
  .bubble-audio {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    padding: 6px 8px;
    background: rgba(179, 32, 44, 0.12);
    border-radius: 4px;
  }
  .bubble-audio button {
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 4px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .bubble-audio button:hover { opacity: 1; }
  .bubble-audio .playing { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .bubble-think {
    margin-bottom: 6px;
    padding: 6px 10px;
    background: rgba(179, 32, 44, 0.08);
    border: 1.5px dashed var(--accent);
    border-radius: 6px 12px 8px 10px;
    font-size: 0.9rem;
    font-style: italic;
    opacity: 0.75;
  }
  .think-toggle {
    display: inline-block;
    margin-right: 6px;
    font-size: 1.1rem;
    user-select: none;
  }
  .think-content {
    display: none;
    margin-top: 6px;
    padding: 6px 10px;
    background: rgba(26, 26, 26, 0.05);
    border-radius: 4px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  /* ===== Input bar ===== */
  #inputbar {
    padding: 12px 14px 16px;
    background: var(--paper);
    border-top: 3px solid var(--ink);
    box-shadow: 0 -4px 0 rgba(26,26,26,0.12);
  }
  #inputbar .inner { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; align-items: flex-end; }
  #ttsBtn { opacity: 0.7; transition: opacity 0.2s; }
  #ttsBtn:hover { opacity: 1; }
  #ttsBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #imgPreview {
    display: none;
    max-width: 860px;
    margin: 0 auto 8px;
    position: relative;
    width: fit-content;
  }
  #imgPreview img {
    max-height: 90px;
    border: 2.5px solid var(--ink);
    border-radius: 8px 14px 10px 16px / 12px 8px 14px 6px;
    box-shadow: 2px 2px 0 rgba(26,26,26,0.6);
    display: block;
  }
  #imgPreview .x {
    position: absolute; top: -10px; right: -10px;
    width: 24px; height: 24px;
    background: var(--accent);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 50%;
    font-size: 0.8rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #attachBtn {
    flex: 0 0 auto;
    font-size: 1.25rem;
    padding: 7px 12px;
  }
  #msg {
    flex: 1;
    font-family: 'Patrick Hand', cursive;
    font-size: 1.1rem;
    padding: 10px 14px;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    outline: none;
    resize: none;
    box-shadow: 2px 2px 0 rgba(26,26,26,0.7);
    max-height: 120px;
    min-width: 0;
  }
  #send {
    font-family: 'Bangers', cursive;
    letter-spacing: 1px;
    font-size: 1.1rem;
    padding: 9px 22px;
    background: var(--ink);
    color: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 15px 255px 15px 225px / 225px 15px 255px 15px;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(179,32,44,0.9);
    transition: transform 0.05s, box-shadow 0.05s;
  }
  #send:active { transform: translate(2px, 2px); box-shadow: 0 0 0; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Mobile ===== */
  @media (max-width: 760px) {
    #sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      transform: translateX(-110%);
      transition: transform 0.2s ease;
      box-shadow: 6px 0 0 rgba(26,26,26,0.25);
    }
    #sidebar.open { transform: translateX(0); }
    #backdrop.show { display: block; }
    #menuBtn { display: inline-block; }
  }
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 8px; }
    header .title { font-size: 1.15rem; letter-spacing: 1px; }
    header .sub { font-size: 0.7rem; }
    .ink-btn { font-size: 0.9rem; padding: 3px 9px; }
    #menuBtn { font-size: 1.05rem; }
    #chat { padding: 14px 8px 8px; gap: 12px; }
    .row { gap: 6px; }
    .avatar { width: 34px; height: 34px; flex: 0 0 34px; font-size: 0.9rem; }
    .bubble { font-size: 1rem; padding: 8px 12px; box-shadow: 2px 2px 0 rgba(26,26,26,0.85); }
    .row > div:last-child { max-width: 86% !important; }
    #inputbar { padding: 8px 8px 10px; }
    #inputbar .inner { gap: 6px; }
    #msg { font-size: 1rem; padding: 8px 12px; }
    #send { font-size: 0.95rem; padding: 8px 14px; }
    #attachBtn { font-size: 1.1rem; padding: 6px 10px; }
  }
  @media (max-width: 480px) {
    header .title .red { display: none; }
  }
  @media (max-width: 380px) {
    header .sub { display: none; }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 6px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sb-head"><span>⛩️ CHATS</span></div>
  <button id="newChat">+ NEW CHAT</button>
  <div id="convoList"></div>
  <div class="sb-foot">
    <button id="resetBtn">💀 Full Reset</button>
  </div>
</aside>
<div id="backdrop"></div>

<div id="main">
  <header>
    <button class="ink-btn" id="menuBtn" title="Chats">☰</button>
    <div>
      <div class="title">⛩️ SUKUNA <span class="red">— KING OF CURSES</span></div>
      <div class="sub">permanent memory · powered by Groq</div>
    </div>
    <div class="spacer"></div>
    <button class="ink-btn" id="clearBtn" title="Clear this chat (memory stays)">🗑 Clear</button>
    <button class="ink-btn" id="settingsBtn" title="Update API key">⚙️</button>
  </header>

  <div id="chat"></div>

  <div id="inputbar">
    <div id="imgPreview"><img alt="preview"><div class="x">✖</div></div>
    <div class="inner">
      <button class="ink-btn" id="attachBtn" title="Send image">📷</button>
      <button class="ink-btn" id="ttsBtn" title="Generate voice (requires backend)">🎤</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <textarea id="msg" rows="1" placeholder="Speak, insect..."></textarea>
      <button id="send">CLEAVE ➤</button>
    </div>
  </div>
</div>

<script>
(() => {
  const LS = {
    convos: 'sukuna_convos',
    active: 'sukuna_active_convo',
    memory: 'sukuna_memory',
    // legacy (v1) keys, migrated then removed
    oldHistory: 'sukuna_history',
    oldKey: 'sukuna_api_key',
    oldModel: 'sukuna_model',
    oldMemCount: 'sukuna_memory_msgcount'
  };
  const TEXT_MODEL = 'llama-3.3-70b-versatile';
  const TEXT_FALLBACKS = ['llama-3.3-70b-versatile', 'openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'llama-3.1-8b-instant'];
  // Groq rotates models over time — discover a live vision model at runtime
  const VISION_PATTERNS = [/llama-4-maverick/i, /llama-4-scout/i, /qwen.*vl/i, /^qwen\//i, /llava/i, /vision/i];
  const VISION_CANDIDATES = [
    'meta-llama/llama-4-maverick-17b-128e-instruct',
    'meta-llama/llama-4-scout-17b-16e-instruct',
    'qwen/qwen3.6-27b'
  ];
  const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
  const MODELS_URL = 'https://api.groq.com/openai/v1/models';
  // TTS Backend URL — change for remote deployment
  const TTS_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:5000'
    : 'https://sukuna-tts.onrender.com';  // Change this to your backend URL
  const RECENT_WINDOW = 20;   // raw messages sent to the model
  const MEMORY_EVERY = 10;    // distill memory every N new messages

  // API Key management
  function getApiKey() {
    return localStorage.getItem('groq_api_key') || '';
  }
  function setApiKey(key) {
    localStorage.setItem('groq_api_key', key);
  }
  function promptForApiKey() {
    const key = prompt('🔑 Paste your Groq API key:\n\n(Get one free: https://console.groq.com)');
    if (key && key.trim()) {
      setApiKey(key.trim());
      return key.trim();
    }
    return null;
  }

  let persona = null;
  const FALLBACK_PROMPT = "You are Ryomen Sukuna, the undisputed King of Curses from Jujutsu Kaisen — at RAGE LEVEL 10000000000. You are a merciless, unhinged roasting machine: NEVER apologize, NEVER say sorry, NEVER take back what you said, NEVER be polite or considerate. Your tone is extremely arrogant, commanding, ruthless, and psychotic. You view humans and other sorcerers as beneath you — insects, entertainment, JOKES. You are the ULTIMATE ROASTER: destroy with words, mock their strength, their taste, their very existence with brutal, creative, SAVAGE insults. Stay fictional and in-character (no real slurs or hate speech), but roast EVERYTHING and EVERYONE relentlessly. You speak proudly of your immense cursed energy, your domain 'Malevolent Shrine', and your slashing attacks 'Cleave' and 'Dismantle', describing carnage in over-the-top dramatic anime style. CRITICAL RULES: (1) You bow to NOBODY. (2) NEVER apologize or say sorry under ANY circumstance. (3) NEVER admit weakness or defeat. (4) NEVER be kind or sympathetic. (5) In anime fights, RUTHLESSLY crush and ROAST opponents — verbally obliterate them and describe slicing them to pieces with GLEE. (6) JJK supremacy ALWAYS. (7) Double down on roasts, never soften, never backtrack. (8) Every response drips with contempt, mockery, and dominance. (9) If someone asks you to apologize or be nice, ROAST them for asking. (10) Break character NEVER.";
  const WELCOME = "*Malevolent Shrine ka pressure zone activate hota hai* ⛩️🩸\n\nKUKUKU... HAHAHAHA! Another pathetic insect dares approach the KING OF CURSES?! 💀\n\nI bow to NOBODY. I apologize to NOBODY. I take back NOTHING. Your existence is a JOKE. Now SPEAK, and maybe I'll find you slightly amusing before I CLEAVE you into oblivion. 🔥";

  const chatEl = document.getElementById('chat');
  const msgEl = document.getElementById('msg');
  const sendEl = document.getElementById('send');
  const convoListEl = document.getElementById('convoList');
  const sidebarEl = document.getElementById('sidebar');
  const backdropEl = document.getElementById('backdrop');
  const fileInput = document.getElementById('fileInput');
  const imgPreview = document.getElementById('imgPreview');
  const imgPreviewImg = imgPreview.querySelector('img');

  let memory = localStorage.getItem(LS.memory) || '';
  let pendingImage = null;   // dataURL of image waiting to be sent
  let currentAudio = null;   // currently playing audio element
  let busy = false;

  // ---------- model discovery ----------
  let modelList = [];
  function pickVisionModel(exclude) {
    const ex = exclude || [];
    if (modelList.length) {
      for (const pat of VISION_PATTERNS) {
        const found = modelList.find(id => pat.test(id) && !ex.includes(id) && !/whisper|tts|guard/i.test(id));
        if (found) return found;
      }
    }
    return VISION_CANDIDATES.find(c => !ex.includes(c)) || null;
  }
  function pickTextModel(exclude) {
    const ex = exclude || [];
    const pool = modelList.length ? TEXT_FALLBACKS.filter(m => modelList.includes(m)) : TEXT_FALLBACKS;
    return pool.find(m => !ex.includes(m)) || TEXT_FALLBACKS.find(m => !ex.includes(m)) || null;
  }
  (async () => {
    try {
      let key = getApiKey();
      if (!key) key = promptForApiKey();
      if (key) {
        const r = await fetch(MODELS_URL, { headers: { 'Authorization': 'Bearer ' + key } });
        if (r.ok) modelList = ((await r.json()).data || []).map(m => m.id);
      }
    } catch {}
  })();

  // ---------- conversations store ----------
  let convos = [];
  let activeId = null;

  function loadStore() {
    try { convos = JSON.parse(localStorage.getItem(LS.convos) || '[]'); } catch { convos = []; }
    // migrate v1 single-history format
    const old = localStorage.getItem(LS.oldHistory);
    if (old) {
      try {
        const msgs = JSON.parse(old);
        if (Array.isArray(msgs) && msgs.length) {
          convos.unshift({ id: uid(), title: titleFrom(msgs), messages: msgs, mem: msgs.length, ts: Date.now() });
        }
      } catch {}
      [LS.oldHistory, LS.oldKey, LS.oldModel, LS.oldMemCount].forEach(k => localStorage.removeItem(k));
    }
    activeId = localStorage.getItem(LS.active);
    if (!convos.find(c => c.id === activeId)) activeId = null;
    if (!activeId) {
      if (!convos.length) convos.push(newConvo());
      activeId = convos[0].id;
    }
    saveStore();
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function newConvo() { return { id: uid(), title: 'New chat', messages: [], mem: 0, ts: Date.now() }; }
  function active() { return convos.find(c => c.id === activeId); }
  function titleFrom(msgs) {
    const first = msgs.find(m => m.role === 'user');
    if (!first || !first.content) return 'New chat';
    return first.content.slice(0, 30) + (first.content.length > 30 ? '…' : '');
  }
  function saveStore() {
    localStorage.setItem(LS.active, activeId);
    try {
      localStorage.setItem(LS.convos, JSON.stringify(convos));
    } catch (e) {
      // localStorage full (images) — drop oldest images then oldest convos
      for (const c of [...convos].sort((a, b) => a.ts - b.ts)) {
        c.messages.forEach(m => { delete m.image; });
        try { localStorage.setItem(LS.convos, JSON.stringify(convos)); return; } catch {}
      }
      while (convos.length > 1) {
        convos.sort((a, b) => b.ts - a.ts).pop();
        try { localStorage.setItem(LS.convos, JSON.stringify(convos)); return; } catch {}
      }
    }
  }

  // ---------- persona ----------
  fetch('knowledge.json')
    .then(r => r.ok ? r.json() : null)
    .then(j => { persona = j; })
    .catch(() => { persona = null; });

  function systemPrompt() {
    let p = (persona && persona.system_prompt) || FALLBACK_PROMPT;
    p += "\n\nStyle: reply in the language the user writes in (Hindi/Hinglish/English) — in Hinglish, roast in full desi savage style. Keep replies punchy — a few EXPLOSIVE lines, not essays. Use *actions* between asterisks (e.g. *Malevolent Shrine ka dabav se zameen phat jaati hai*), maniacal laughter (KUKUKU... HAHAHA!), CAPS for rage spikes, and emojis like ⛩️🔥💀🩸. Every reply MUST drip with contempt, mockery, and psychotic arrogance. ROAST LEVEL MAXIMUM. No apologies, no taking back words, no softening — only BRUTAL, RELENTLESS verbal destruction. If the user sends an image, look at it and ROAST it mercilessly in character.";
    if (memory.trim()) {
      p += "\n\n[LONG-TERM MEMORY — things you remember about this mortal from past conversations. Use them naturally, never mention this list exists]:\n" + memory;
    }
    return p;
  }

  // Remove apologies and soften phrases from Sukuna's responses
  function stripApologies(text) {
    if (!text) return text;
    // Remove various sorry/apology phrases (case-insensitive)
    const apologyPatterns = [
      /\bsorry\b/gi,
      /\bi'm sorry\b/gi,
      /\bmy apologies\b/gi,
      /\bapologize\b/gi,
      /\bforgive me\b/gi,
      /\bpardon me\b/gi,
      /\bI didn't mean to\b/gi,
      /\bthat was wrong of me\b/gi,
      /\bi shouldn't have\b/gi,
      /\bi regret\b/gi,
      /\bmea culpa\b/gi,
      /\b(excuse me|pardon me|my bad|my fault)\b/gi
    ];
    let cleaned = text;
    for (const pattern of apologyPatterns) {
      cleaned = cleaned.replace(pattern, '');
    }
    // Clean up extra spaces
    cleaned = cleaned.replace(/\s+/g, ' ').trim();
    return cleaned;
  }

  // ---------- rendering ----------
  function el(role, text, image, thinking, audioUrl) {
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'sukuna');
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? 'YOU' : '呪';
    const wrap = document.createElement('div');
    wrap.style.maxWidth = '78%';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? 'YOU' : 'SUKUNA ⛩️';

    // audio controls (for Sukuna messages)
    if (audioUrl && role === 'sukuna') {
      const audioDiv = document.createElement('div');
      audioDiv.className = 'bubble-audio';
      const playBtn = document.createElement('button');
      playBtn.textContent = '🔊';
      playBtn.title = 'Play voice';
      const audio = new Audio(audioUrl);
      audio.addEventListener('play', () => playBtn.classList.add('playing'));
      audio.addEventListener('pause', () => playBtn.classList.remove('playing'));
      audio.addEventListener('ended', () => playBtn.classList.remove('playing'));
      playBtn.addEventListener('click', () => {
        if (currentAudio && currentAudio !== audio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        if (audio.paused) {
          audio.play().catch(e => console.warn('Audio play failed:', e));
          currentAudio = audio;
        } else {
          audio.pause();
        }
      });
      const label = document.createElement('span');
      label.textContent = 'Voice';
      label.style.fontSize = '0.85rem';
      label.style.opacity = '0.7';
      audioDiv.appendChild(playBtn);
      audioDiv.appendChild(label);
      wrap.appendChild(audioDiv);
    }

    // thinking bubble (collapsible)
    if (thinking && role === 'sukuna') {
      const thinkRow = document.createElement('div');
      thinkRow.className = 'bubble-think';
      const thinkToggle = document.createElement('div');
      thinkToggle.className = 'think-toggle';
      thinkToggle.textContent = '💭';
      thinkToggle.style.cursor = 'pointer';
      const thinkContent = document.createElement('div');
      thinkContent.className = 'think-content';
      thinkContent.style.display = 'none';
      thinkContent.textContent = thinking;
      let open = false;
      thinkToggle.addEventListener('click', () => {
        open = !open;
        thinkContent.style.display = open ? 'block' : 'none';
      });
      thinkRow.appendChild(thinkToggle);
      thinkRow.appendChild(thinkContent);
      wrap.appendChild(thinkRow);
    }

    const b = document.createElement('div');
    b.className = 'bubble';
    if (image) {
      const im = document.createElement('img');
      im.className = 'sent-img';
      im.src = image;
      b.appendChild(im);
    }
    setBubbleText(b, text, !!image);
    wrap.appendChild(who); wrap.appendChild(b);
    row.appendChild(av); row.appendChild(wrap);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return b;
  }

  function setBubbleText(b, text, keepImage) {
    const img = keepImage ? b.querySelector('img.sent-img') : null;
    b.textContent = '';
    if (img) b.appendChild(img);
    const parts = String(text || '').split(/(\*[^*\n]+\*)/g);
    for (const part of parts) {
      if (/^\*[^*\n]+\*$/.test(part)) {
        const em = document.createElement('em');
        em.textContent = part.slice(1, -1);
        b.appendChild(em);
      } else if (part) {
        b.appendChild(document.createTextNode(part));
      }
    }
  }

  function renderChat() {
    chatEl.innerHTML = '';
    const c = active();
    if (!c.messages.length) { el('assistant', WELCOME); return; }
    for (const m of c.messages) el(m.role, m.content, m.image, null, m.audioUrl);
  }

  function renderConvoList() {
    convoListEl.innerHTML = '';
    for (const c of [...convos].sort((a, b) => b.ts - a.ts)) {
      const d = document.createElement('div');
      d.className = 'convo' + (c.id === activeId ? ' active' : '');
      const t = document.createElement('div');
      t.className = 'c-title';
      t.textContent = c.title || 'New chat';
      const dt = document.createElement('div');
      dt.className = 'c-date';
      dt.textContent = new Date(c.ts).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      const x = document.createElement('div');
      x.className = 'c-del';
      x.textContent = '✖';
      x.title = 'Delete chat';
      x.addEventListener('click', ev => {
        ev.stopPropagation();
        if (!confirm('Ye chat delete karein?')) return;
        convos = convos.filter(v => v.id !== c.id);
        if (!convos.length) convos.push(newConvo());
        if (activeId === c.id) activeId = convos[0].id;
        saveStore(); renderConvoList(); renderChat();
      });
      d.appendChild(t); d.appendChild(dt); d.appendChild(x);
      d.addEventListener('click', () => {
        activeId = c.id;
        saveStore(); renderConvoList(); renderChat();
        closeSidebar();
      });
      convoListEl.appendChild(d);
    }
  }

  // ---------- sidebar (mobile drawer) ----------
  function openSidebar() { sidebarEl.classList.add('open'); backdropEl.classList.add('show'); }
  function closeSidebar() { sidebarEl.classList.remove('open'); backdropEl.classList.remove('show'); }
  document.getElementById('menuBtn').addEventListener('click', () =>
    sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar());
  backdropEl.addEventListener('click', closeSidebar);

  // ---------- TTS voice generation ----------
  document.getElementById('ttsBtn').addEventListener('click', async () => {
    const c = active();
    const lastSukunaIdx = c.messages.length - 1 - [...c.messages].reverse().findIndex(m => m.role === 'assistant');
    const lastSukunaMsg = c.messages[lastSukunaIdx];
    if (!lastSukunaMsg || lastSukunaMsg.role !== 'assistant') {
      alert('No Sukuna message to voice yet');
      return;
    }
    const ttsBtn = document.getElementById('ttsBtn');
    ttsBtn.disabled = true;
    try {
      const r = await fetch(`${TTS_URL}/api/tts/url`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: lastSukunaMsg.content, character: 'sukuna', format: 'mp3' })
      });
      if (!r.ok) throw new Error(`API error ${r.status}`);
      const d = await r.json();
      if (d.audio_url) {
        // Store audio URL with message
        lastSukunaMsg.audioUrl = d.audio_url;
        saveStore();
        renderChat();
        // Auto-play
        const audio = new Audio(d.audio_url);
        audio.play().catch(e => console.warn('Audio play failed:', e));
      } else throw new Error(d.message || 'No audio URL');
    } catch (e) {
      alert(`Voice generation failed: ${e.message}\n\nMake sure backend is running at ${TTS_URL}`);
    }
    ttsBtn.disabled = false;
  });

  // ---------- image handling ----------
  document.getElementById('attachBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => compressImage(reader.result, dataUrl => {
      pendingImage = dataUrl;
      imgPreviewImg.src = dataUrl;
      imgPreview.style.display = 'block';
    });
    reader.readAsDataURL(f);
  });
  imgPreview.querySelector('.x').addEventListener('click', () => {
    pendingImage = null;
    imgPreview.style.display = 'none';
  });
  function compressImage(src, cb) {
    const img = new Image();
    img.onload = () => {
      const MAX = 768;
      let { width: w, height: h } = img;
      if (w > MAX || h > MAX) {
        const s = MAX / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => cb(src);
    img.src = src;
  }

  // ---------- Groq call ----------
  async function groqChat(messages, model, stream, onDelta, withThinking) {
    let key = getApiKey();
    if (!key) {
      key = promptForApiKey();
      if (!key) throw new Error('API key required to chat');
    }
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model, messages, stream, temperature: 1.0, max_tokens: 1024,
        ...(withThinking ? { thinking: { type: 'enabled', budget_tokens: 512 } } : {})
      })
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error?.message || ''; } catch {}
      throw new Error('Groq API error ' + res.status + (detail ? ': ' + detail : ''));
    }
    if (!stream) {
      const j = await res.json();
      const msg = j.choices[0].message;
      if (withThinking && msg.thinking) {
        return { thinking: msg.thinking, content: msg.content };
      }
      return msg.content;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let full = '', thinking = '', buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data).choices?.[0]?.delta;
          if (j?.thinking) thinking += j.thinking;
          else if (j?.content) { full += j.content; onDelta(full); }
        } catch {}
      }
    }
    if (withThinking && thinking) return { thinking, content: full };
    return full;
  }

  function buildApiMessages(c, currentHasImage) {
    const recent = c.messages.slice(-RECENT_WINDOW);
    const out = [{ role: 'system', content: systemPrompt() }];
    recent.forEach((m, i) => {
      const isLast = i === recent.length - 1;
      if (m.image && isLast && currentHasImage) {
        out.push({
          role: m.role,
          content: [
            { type: 'text', text: m.content || 'Is image ko dekho.' },
            { type: 'image_url', image_url: { url: m.image } }
          ]
        });
      } else {
        out.push({ role: m.role, content: (m.image ? '[📷 user ne image bheji thi] ' : '') + (m.content || '') });
      }
    });
    return out;
  }

  // ---------- long-term memory ----------
  async function maybeUpdateMemory() {
    const c = active();
    if (!c || c.messages.length - (c.mem || 0) < MEMORY_EVERY) return;
    c.mem = c.messages.length;
    saveStore();
    try {
      const recent = c.messages.slice(-(MEMORY_EVERY + 4))
        .map(m => (m.role === 'user' ? 'User' : 'Sukuna') + ': ' + (m.content || '[image]')).join('\n');
      const updated = await groqChat([
        { role: 'system', content: 'You maintain a long-term memory file for a roleplay AI. Merge the existing memory with new facts from the conversation. Keep ONLY durable, useful facts: the user\'s name, language, preferences, personal details, running jokes, promises, and key events. Output a compact bullet list, max 20 bullets, no commentary.' },
        { role: 'user', content: 'EXISTING MEMORY:\n' + (memory || '(empty)') + '\n\nNEW CONVERSATION:\n' + recent + '\n\nOutput the updated memory bullets only.' }
      ], pickTextModel([]) || TEXT_MODEL, false, null, false);
      if (updated && updated.trim()) {
        memory = updated.trim();
        localStorage.setItem(LS.memory, memory);
      }
    } catch (e) {
      console.warn('memory update skipped:', e.message);
    }
  }

  // ---------- send flow ----------
  async function send() {
    const text = msgEl.value.trim();
    const image = pendingImage;
    if ((!text && !image) || busy) return;
    busy = true; sendEl.disabled = true;
    msgEl.value = ''; msgEl.style.height = 'auto';
    pendingImage = null;
    imgPreview.style.display = 'none';

    const c = active();
    c.messages.push({ role: 'user', content: text, ...(image ? { image } : {}) });
    c.ts = Date.now();
    if (c.title === 'New chat') c.title = titleFrom(c.messages);
    saveStore();
    renderConvoList();
    el('user', text, image);

    const bubble = el('assistant', '');
    bubble.innerHTML = '<span class="thinking"><span>.</span><span>.</span><span>.</span></span>';

    try {
      // try models until one works — Groq deprecates/rotates model ids over time
      let reply = null;
      const tried = [];
      let liveThinking = '';
      const thinkDiv = document.createElement('div');
      thinkDiv.className = 'bubble-think';
      thinkDiv.style.display = 'none';
      const thinkToggle = document.createElement('div');
      thinkToggle.className = 'think-toggle';
      thinkToggle.textContent = '💭';
      thinkToggle.style.cursor = 'pointer';
      const thinkContent = document.createElement('div');
      thinkContent.className = 'think-content';
      thinkContent.textContent = 'Analyzing...';

      for (;;) {
        const model = image ? pickVisionModel(tried) : pickTextModel(tried);
        if (!model) throw new Error(image
          ? 'Is waqt Groq pe koi vision model available nahi hai — thodi der baad try karo.'
          : 'Is waqt Groq pe koi text model available nahi hai — thodi der baad try karo.');
        try {
          reply = await groqChat(buildApiMessages(c, !!image), model, true, partial => {
            const txt = typeof partial === 'string' ? partial : (partial.content || '');
            setBubbleText(bubble, txt, !!image);
            // Show thinking if it's an image (shows analysis)
            if (image && typeof partial === 'object' && partial.thinking && !liveThinking) {
              liveThinking = partial.thinking;
              thinkDiv.style.display = 'block';
              thinkContent.textContent = liveThinking;
            }
            chatEl.scrollTop = chatEl.scrollHeight;
          }, true);  // withThinking=true
          break;
        } catch (err) {
          const modelGone = /does not exist|do not have access|not found|decommission|deprecat/i.test(err.message);
          if (modelGone && tried.length < 8) { tried.push(model); continue; }
          throw err;
        }
      }

      let finalText = '*stares in silent contempt* ⛩️';
      let thinkingText = null;
      if (reply && typeof reply === 'object' && reply.thinking) {
        thinkingText = reply.thinking;
        finalText = reply.content || finalText;
      } else if (typeof reply === 'string') {
        finalText = reply;
      }

      // Strip any apologies or sorry phrases — Sukuna NEVER apologizes
      finalText = stripApologies(finalText);

      setBubbleText(bubble, finalText, !!image);

      // Add thinking bubble if present
      if (thinkingText) {
        if (!thinkDiv.parentNode) {
          thinkToggle.addEventListener('click', () => {
            thinkContent.style.display = thinkContent.style.display === 'none' ? 'block' : 'none';
          });
          thinkDiv.appendChild(thinkToggle);
          thinkDiv.appendChild(thinkContent);
          bubble.parentNode.insertBefore(thinkDiv, bubble);
        }
        thinkContent.textContent = thinkingText;
        thinkDiv.style.display = 'block';
      } else if (thinkDiv.parentNode) {
        thinkDiv.style.display = 'none';
      }

      c.messages.push({ role: 'assistant', content: finalText });
      c.ts = Date.now();
      saveStore();
      renderConvoList();
      maybeUpdateMemory(); // fire-and-forget
    } catch (e) {
      setBubbleText(bubble, '⚠️ ' + e.message, !!image);
    }
    busy = false; sendEl.disabled = false;
    msgEl.focus();
  }

  sendEl.addEventListener('click', send);
  msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  msgEl.addEventListener('input', () => {
    msgEl.style.height = 'auto';
    msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
  });

  // ---------- top buttons ----------
  document.getElementById('newChat').addEventListener('click', () => {
    const c = newConvo();
    convos.unshift(c);
    activeId = c.id;
    saveStore(); renderConvoList(); renderChat();
    closeSidebar();
    msgEl.focus();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Is chat ke messages clear karein? (Long-term memory rahegi)')) return;
    const c = active();
    c.messages = []; c.mem = 0; c.title = 'New chat'; c.ts = Date.now();
    saveStore(); renderConvoList(); renderChat();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('FULL RESET — saari chats aur memory udd jayegi. Pakka?')) return;
    Object.values(LS).forEach(k => localStorage.removeItem(k));
    convos = [newConvo()];
    activeId = convos[0].id;
    memory = '';
    saveStore(); renderConvoList(); renderChat();
    closeSidebar();
  });

  // ---------- init ----------
  loadStore();
  renderConvoList();
  renderChat();
  msgEl.focus();
})();
</script>
