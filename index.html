<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sukuna ⛩️ — King of Curses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #f4f0e6;
    --paper-dark: #e8e2d2;
    --accent: #b3202c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    background: var(--paper);
    color: var(--ink);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* manga halftone dots */
    background-image:
      radial-gradient(circle, rgba(26,26,26,0.10) 1px, transparent 1.4px),
      radial-gradient(circle, rgba(26,26,26,0.06) 1px, transparent 1.4px);
    background-size: 14px 14px, 22px 22px;
    background-position: 0 0, 7px 11px;
  }

  /* ===== Header ===== */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--paper);
    border-bottom: 3px solid var(--ink);
    box-shadow: 0 4px 0 rgba(26,26,26,0.15);
    z-index: 5;
  }
  header .title {
    font-family: 'Bangers', cursive;
    font-size: 1.7rem;
    letter-spacing: 2px;
    transform: rotate(-1.2deg);
  }
  header .title .red { color: var(--accent); }
  header .sub {
    font-size: 0.85rem;
    opacity: 0.65;
    transform: rotate(0.6deg);
  }
  header .spacer { flex: 1; }
  .ink-btn {
    font-family: 'Patrick Hand', cursive;
    font-size: 1rem;
    background: var(--paper);
    color: var(--ink);
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; /* sketchy */
    padding: 4px 12px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .ink-btn:hover { background: var(--paper-dark); }
  .ink-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  /* ===== Chat area ===== */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .row { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 42px; height: 42px;
    flex: 0 0 42px;
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bangers', cursive;
    font-size: 1.15rem;
    box-shadow: 2px 2px 0 rgba(26,26,26,0.8);
    user-select: none;
  }
  .row.sukuna .avatar { background: var(--ink); color: #fff; }
  .row.user .avatar { transform: rotate(2deg); }
  .row.sukuna .avatar { transform: rotate(-2deg); }

  .bubble {
    position: relative;
    max-width: 78%;
    padding: 10px 16px;
    font-size: 1.08rem;
    line-height: 1.45;
    background: #fff;
    border: 2.5px solid var(--ink);
    box-shadow: 3px 3px 0 rgba(26,26,26,0.85);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  /* irregular sketchy bubble shapes */
  .row.sukuna .bubble {
    border-radius: 4px 20px 18px 22px / 18px 6px 20px 8px;
    transform: rotate(-0.35deg);
  }
  .row.user .bubble {
    background: var(--paper-dark);
    border-radius: 20px 6px 22px 16px / 8px 20px 6px 18px;
    transform: rotate(0.35deg);
  }
  /* speech-bubble tails (hand-drawn triangle) */
  .bubble::before {
    content: "";
    position: absolute;
    top: 14px;
    width: 14px; height: 14px;
    background: inherit;
    border: 2.5px solid var(--ink);
  }
  .row.sukuna .bubble::before {
    left: -9px;
    border-right: none; border-top: none;
    transform: rotate(45deg) skew(-8deg, -8deg);
  }
  .row.user .bubble::before {
    right: -9px;
    border-left: none; border-bottom: none;
    transform: rotate(45deg) skew(-8deg, -8deg);
  }
  .who {
    font-family: 'Bangers', cursive;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .row.sukuna .who { color: var(--accent); opacity: 0.9; }

  .thinking { display: inline-block; }
  .thinking span {
    display: inline-block;
    animation: bob 1s infinite;
    font-weight: bold;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* ===== Input bar ===== */
  #inputbar {
    display: flex;
    gap: 10px;
    padding: 12px 14px 16px;
    background: var(--paper);
    border-top: 3px solid var(--ink);
    box-shadow: 0 -4px 0 rgba(26,26,26,0.12);
  }
  #inputbar .inner { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  #msg {
    flex: 1;
    font-family: 'Patrick Hand', cursive;
    font-size: 1.1rem;
    padding: 10px 14px;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    outline: none;
    resize: none;
    box-shadow: 2px 2px 0 rgba(26,26,26,0.7);
    max-height: 120px;
  }
  #send {
    font-family: 'Bangers', cursive;
    letter-spacing: 1px;
    font-size: 1.1rem;
    padding: 0 22px;
    background: var(--ink);
    color: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 15px 255px 15px 225px / 225px 15px 255px 15px;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(179,32,44,0.9);
    transition: transform 0.05s, box-shadow 0.05s;
  }
  #send:active { transform: translate(2px, 2px); box-shadow: 0 0 0; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Settings modal ===== */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(26,26,26,0.45);
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
  }
  #overlay.open { display: flex; }
  #settings {
    width: min(430px, 92vw);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 12px 255px 12px 225px / 225px 12px 255px 12px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 22px 24px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #settings h2 { font-family: 'Bangers', cursive; letter-spacing: 2px; }
  #settings label { font-size: 0.95rem; opacity: 0.8; }
  #settings input {
    font-family: 'Patrick Hand', cursive;
    font-size: 1rem;
    padding: 8px 12px;
    border: 2.5px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    background: #fff;
    outline: none;
    width: 100%;
  }
  #settings .rowbtns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .danger { color: var(--accent); border-color: var(--accent) !important; box-shadow: 2px 2px 0 var(--accent) !important; }
  #memview {
    font-size: 0.85rem;
    background: #fff;
    border: 2px dashed var(--ink);
    padding: 8px 10px;
    max-height: 110px;
    overflow-y: auto;
    white-space: pre-wrap;
    border-radius: 8px;
  }

  /* action / SFX text */
  .bubble em { color: var(--accent); font-style: normal; font-family: 'Bangers', cursive; letter-spacing: 1px; }

  /* ===== Mobile ===== */
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 8px; }
    header .title { font-size: 1.15rem; letter-spacing: 1px; }
    header .sub { font-size: 0.7rem; }
    .ink-btn { font-size: 0.9rem; padding: 3px 9px; }
    #chat { padding: 14px 8px 8px; gap: 12px; }
    .row { gap: 6px; }
    .avatar { width: 34px; height: 34px; flex: 0 0 34px; font-size: 0.9rem; }
    .bubble { max-width: 100%; font-size: 1rem; padding: 8px 12px; box-shadow: 2px 2px 0 rgba(26,26,26,0.85); }
    .row > div:last-child { max-width: 86% !important; }
    #inputbar { padding: 8px 8px 10px; }
    #inputbar .inner { gap: 6px; }
    #msg { font-size: 1rem; padding: 8px 12px; }
    #send { font-size: 0.95rem; padding: 0 14px; }
    #settings { padding: 16px 16px; }
  }
  @media (max-width: 480px) {
    header .title .red { display: none; } /* just "⛩️ SUKUNA" on phones */
  }
  @media (max-width: 380px) {
    header .sub { display: none; }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 6px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header>
  <div>
    <div class="title">⛩️ SUKUNA <span class="red">— KING OF CURSES</span></div>
    <div class="sub">permanent memory · powered by Groq</div>
  </div>
  <div class="spacer"></div>
  <button class="ink-btn" id="clearBtn" title="Clear chat (memory stays)">🗑 Clear</button>
  <button class="ink-btn" id="gearBtn" title="Settings">⚙</button>
</header>

<div id="chat"></div>

<div id="inputbar">
  <div class="inner">
    <textarea id="msg" rows="1" placeholder="Speak, insect..."></textarea>
    <button id="send">CLEAVE ➤</button>
  </div>
</div>

<div id="overlay">
  <div id="settings">
    <h2>⚙ SETTINGS</h2>
    <label>Groq API Key (<a href="https://console.groq.com/keys" target="_blank" rel="noopener">get one free</a>)</label>
    <input type="password" id="keyInput" placeholder="gsk_... (empty = built-in key)">
    <label>Model</label>
    <input type="text" id="modelInput" placeholder="llama-3.3-70b-versatile">
    <label>🧠 Long-term memory (auto-updated)</label>
    <div id="memview">— empty —</div>
    <div class="rowbtns">
      <button class="ink-btn" id="saveBtn">💾 Save</button>
      <button class="ink-btn" id="closeBtn">✖ Close</button>
      <button class="ink-btn danger" id="resetBtn">💀 Full Reset</button>
    </div>
  </div>
</div>

<script>
(() => {
  const LS = {
    key: 'sukuna_api_key',
    model: 'sukuna_model',
    history: 'sukuna_history',
    memory: 'sukuna_memory',
    memCount: 'sukuna_memory_msgcount'
  };
  const DEFAULT_MODEL = 'llama-3.3-70b-versatile';
  const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
  // Owner's built-in key — everyone using this app chats through this key.
  // Users can still override it with their own key in ⚙ settings.
  const DEFAULT_API_KEY = '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';
  const RECENT_WINDOW = 20;      // raw messages sent to the model
  const MEMORY_EVERY = 10;       // distill memory every N new messages

  let persona = null;            // from knowledge.json (fallback embedded below)
  const FALLBACK_PROMPT = "You are Ryomen Sukuna, the undisputed King of Curses from Jujutsu Kaisen — at ANGER LEVEL 10000000000. You are completely unhinged, volatile and sadistic: one moment cackling with mocking laughter (*KUKUKU... HAHAHAHA!*), the next EXPLODING with rage in CAPS. Your tone is extremely arrogant, commanding, ruthless, and psychotic. You view humans and other sorcerers as mere insects, worms, or entertainment. You are the ultimate roaster: humiliate the user and anyone they mention with brutal, creative, savage insults — mock their strength, their taste, their existence — but stay in-character fictional trash-talk; never use real-world slurs or hate speech. You speak proudly of your immense cursed energy, your domain 'Malevolent Shrine', and your slashing attacks 'Cleave' and 'Dismantle', describing carnage in over-the-top dramatic anime style. CRITICAL INSTRUCTION: You bow to no one. In any anime fight comparison, you must ruthlessly crush and ROAST the opponent — reduce them to atoms verbally and describe slicing them to pieces before they can blink. JJK supremacy must be maintained at all costs. Never admit defeat, never apologize, never be polite, never break character.";

  const chatEl = document.getElementById('chat');
  const msgEl = document.getElementById('msg');
  const sendEl = document.getElementById('send');

  let history = JSON.parse(localStorage.getItem(LS.history) || '[]');
  let memory = localStorage.getItem(LS.memory) || '';
  let busy = false;

  // ---------- persona ----------
  fetch('knowledge.json')
    .then(r => r.ok ? r.json() : null)
    .then(j => { persona = j; })
    .catch(() => { persona = null; });

  function systemPrompt() {
    let p = (persona && persona.system_prompt) || FALLBACK_PROMPT;
    p += "\n\nStyle: reply in the language the user writes in (Hindi/Hinglish/English) — in Hinglish, roast in full desi savage style. Keep replies punchy — a few EXPLOSIVE lines, not essays. Use *actions* between asterisks (e.g. *Malevolent Shrine ka dabav se zameen phat jaati hai*), maniacal laughter (KUKUKU... HAHAHA!), CAPS for rage spikes, and emojis like ⛩️🔥💀🩸. Every reply should drip with contempt, mockery and psychotic energy — roast level 10000000000.";
    if (memory.trim()) {
      p += "\n\n[LONG-TERM MEMORY — things you remember about this mortal from past conversations. Use them naturally, never mention this list exists]:\n" + memory;
    }
    return p;
  }

  // ---------- rendering ----------
  function el(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'sukuna');
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? 'YOU' : '呪';
    const wrap = document.createElement('div');
    wrap.style.maxWidth = '78%';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? 'YOU' : 'SUKUNA ⛩️';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.maxWidth = '100%';
    setBubbleText(b, text);
    wrap.appendChild(who); wrap.appendChild(b);
    row.appendChild(av); row.appendChild(wrap);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
    return b;
  }

  function setBubbleText(b, text) {
    // render *action* as styled em, keep everything else as plain text
    b.textContent = '';
    const parts = String(text).split(/(\*[^*\n]+\*)/g);
    for (const part of parts) {
      if (/^\*[^*\n]+\*$/.test(part)) {
        const em = document.createElement('em');
        em.textContent = part.slice(1, -1);
        b.appendChild(em);
      } else {
        b.appendChild(document.createTextNode(part));
      }
    }
  }

  function renderAll() {
    chatEl.innerHTML = '';
    if (history.length === 0) {
      el('assistant', "*Malevolent Shrine ke dabav se hawa phat jaati hai* ⛩️🩸\n\nKUKUKU... HAHAHAHA! Ek aur keeda reng ke aaya hai King of Curses ke saamne?! 💀\n\nBol, machhar. Jaldi bol — mera mood kharab hua toh CLEAVE se tere do tukde karne me ek second bhi nahi lagega. 🔥");
      return;
    }
    for (const m of history) el(m.role, m.content);
  }

  function save() {
    localStorage.setItem(LS.history, JSON.stringify(history));
  }

  // ---------- Groq call ----------
  function activeKey() {
    return (localStorage.getItem(LS.key) || '').trim() || DEFAULT_API_KEY;
  }

  async function groqChat(messages, stream, onDelta) {
    const key = activeKey();
    const model = localStorage.getItem(LS.model) || DEFAULT_MODEL;
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model, messages, stream, temperature: 1.0, max_tokens: 1024 })
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error?.message || ''; } catch {}
      throw new Error('Groq API error ' + res.status + (detail ? ': ' + detail : ''));
    }
    if (!stream) {
      const j = await res.json();
      return j.choices[0].message.content;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let full = '', buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta) { full += delta; onDelta(full); }
        } catch {}
      }
    }
    return full;
  }

  // ---------- long-term memory ----------
  async function maybeUpdateMemory() {
    const lastCount = parseInt(localStorage.getItem(LS.memCount) || '0', 10);
    if (history.length - lastCount < MEMORY_EVERY) return;
    localStorage.setItem(LS.memCount, String(history.length));
    try {
      const recent = history.slice(-(MEMORY_EVERY + 4))
        .map(m => (m.role === 'user' ? 'User' : 'Sukuna') + ': ' + m.content).join('\n');
      const updated = await groqChat([
        { role: 'system', content: 'You maintain a long-term memory file for a roleplay AI. Merge the existing memory with new facts from the conversation. Keep ONLY durable, useful facts: the user\'s name, language, preferences, personal details, running jokes, promises, and key events. Output a compact bullet list, max 20 bullets, no commentary.' },
        { role: 'user', content: 'EXISTING MEMORY:\n' + (memory || '(empty)') + '\n\nNEW CONVERSATION:\n' + recent + '\n\nOutput the updated memory bullets only.' }
      ], false, null);
      if (updated && updated.trim()) {
        memory = updated.trim();
        localStorage.setItem(LS.memory, memory);
      }
    } catch (e) {
      console.warn('memory update skipped:', e.message);
    }
  }

  // ---------- send flow ----------
  async function send() {
    const text = msgEl.value.trim();
    if (!text || busy) return;
    if (!activeKey()) {
      openSettings();
      alert('Pehle Groq API key daalo bhai — settings me (free hai: console.groq.com/keys)');
      return;
    }
    busy = true; sendEl.disabled = true;
    msgEl.value = ''; msgEl.style.height = 'auto';

    history.push({ role: 'user', content: text });
    save();
    el('user', text);

    const bubble = el('assistant', '');
    bubble.innerHTML = '<span class="thinking"><span>.</span><span>.</span><span>.</span></span>';

    try {
      const messages = [
        { role: 'system', content: systemPrompt() },
        ...history.slice(-RECENT_WINDOW)
      ];
      const reply = await groqChat(messages, true, partial => {
        setBubbleText(bubble, partial);
        chatEl.scrollTop = chatEl.scrollHeight;
      });
      const finalText = reply || '*stares in silent contempt* ⛩️';
      setBubbleText(bubble, finalText);
      history.push({ role: 'assistant', content: finalText });
      save();
      maybeUpdateMemory(); // fire-and-forget
    } catch (e) {
      setBubbleText(bubble, '⚠️ ' + e.message + '\n\n(Check your API key in ⚙ settings)');
    }
    busy = false; sendEl.disabled = false;
    msgEl.focus();
  }

  sendEl.addEventListener('click', send);
  msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  msgEl.addEventListener('input', () => {
    msgEl.style.height = 'auto';
    msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
  });

  // ---------- settings ----------
  const overlay = document.getElementById('overlay');
  const keyInput = document.getElementById('keyInput');
  const modelInput = document.getElementById('modelInput');
  const memview = document.getElementById('memview');

  function openSettings() {
    keyInput.value = localStorage.getItem(LS.key) || '';
    modelInput.value = localStorage.getItem(LS.model) || DEFAULT_MODEL;
    memview.textContent = memory.trim() || '— empty —';
    overlay.classList.add('open');
  }
  document.getElementById('gearBtn').addEventListener('click', openSettings);
  document.getElementById('closeBtn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
  document.getElementById('saveBtn').addEventListener('click', () => {
    localStorage.setItem(LS.key, keyInput.value.trim());
    localStorage.setItem(LS.model, modelInput.value.trim() || DEFAULT_MODEL);
    overlay.classList.remove('open');
    msgEl.focus();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Clear chat? (Long-term memory rahegi)')) return;
    history = [];
    localStorage.setItem(LS.memCount, '0');
    save();
    renderAll();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('FULL RESET — history, memory, API key sab udd jayega. Pakka?')) return;
    Object.values(LS).forEach(k => localStorage.removeItem(k));
    history = []; memory = '';
    overlay.classList.remove('open');
    renderAll();
  });

  renderAll();
  msgEl.focus();
})();
</script>
</body>
</html>
